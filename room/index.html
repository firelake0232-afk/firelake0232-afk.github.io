<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
</head>
<body>
<div id="root"></div>
<link href="assets/bootstrap.min.css" rel="stylesheet">
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    overflow: hidden;
    font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
  }

  .card {
    position: fixed;
    right: 24px;
    top: 24px;
    z-index:10000;
    padding: 1rem;
    width: 20rem;
  }
</style>
<script src="assets/react.development.js"></script>
<script src="assets/react-dom.development.js"></script>
<script src="assets/three.min.js"></script>
<script src="assets/OrbitControls.js"></script>
<script src="assets/babel.min.js"></script>


<script>
  function getRandomInt(min, max) {
    min = Math.ceil(min);
    max = Math.floor(max);
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }


  function movePoint(point, angle, dist) {
    const radians = angle * Math.PI / 180;
    const dx = Math.cos(radians) * dist;
    const dy = Math.sin(radians) * dist;
    return [point[0] + dx, point[1] + dy];
  }


  function rotatePoints(points, angle, origin) {

    const radians = angle * Math.PI / 180;
    const cos = Math.cos(radians);
    const sin = Math.sin(radians);


    const [originX, originY] = origin;


    return points.map(point => {
      const [x, y] = point;

      const translatedX = x - originX;
      const translatedY = y - originY;

      const rotatedX = translatedX * cos - translatedY * sin;
      const rotatedY = translatedX * sin + translatedY * cos;

      return [rotatedX + originX, rotatedY + originY];
    });
  }

  function intersectionArea(polygon1, polygon2) {
    // Класс точки
    class Point {
      constructor(x, y) {
        this.x = x;
        this.y = y;
      }
    }

    // Функция для проверки, находится ли точка внутри полигона
    function pointInPolygon(point, polygon) {
      let inside = false;
      for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
        const xi = polygon[i].x, yi = polygon[i].y;
        const xj = polygon[j].x, yj = polygon[j].y;

        const intersect = ((yi > point.y) != (yj > point.y))
        && (point.x < (xj - xi) * (point.y - yi) / (yj - yi) + xi);
        if (intersect) inside = !inside;
      }
      return inside;
    }

    // Функция для нахождения пересечения двух отрезков
    function lineIntersection(p1, p2, p3, p4) {
      const d = (p2.x - p1.x) * (p4.y - p3.y) - (p2.y - p1.y) * (p4.x - p3.x);
      if (Math.abs(d) < 1e-10) return null; // Параллельные отрезки

      const ua = ((p4.x - p3.x) * (p1.y - p3.y) - (p4.y - p3.y) * (p1.x - p3.x)) / d;
      const ub = ((p2.x - p1.x) * (p1.y - p3.y) - (p2.y - p1.y) * (p1.x - p3.x)) / d;

      if (ua >= 0 && ua <= 1 && ub >= 0 && ub <= 1) {
        return new Point(p1.x + ua * (p2.x - p1.x), p1.y + ua * (p2.y - p1.y));
      }
      return null;
    }

    // Функция для вычисления площади многоугольника (формула Гаусса)
    function polygonArea(polygon) {
      if (polygon.length < 3) return 0;
      let area = 0;
      for (let i = 0; i < polygon.length; i++) {
        const j = (i + 1) % polygon.length;
        area += polygon[i].x * polygon[j].y;
        area -= polygon[j].x * polygon[i].y;
      }
      return Math.abs(area) / 2;
    }

    // Функция для сортировки точек по часовой стрелке
    function sortPoints(points, center) {
      return points.sort((a, b) => {
        const angleA = Math.atan2(a.y - center.y, a.x - center.x);
        const angleB = Math.atan2(b.y - center.y, b.x - center.x);
        return angleA - angleB;
      });
    }

    // Преобразование входных данных в объекты Point
    const poly1 = polygon1.map(p => new Point(p[0], p[1]));
    const poly2 = polygon2.map(p => new Point(p[0], p[1]));

    // Коллекция точек пересечения
    const intersectionPoints = [];

    // 1. Добавляем вершины первого полигона, которые лежат внутри второго
    for (const point of poly1) {
      if (pointInPolygon(point, poly2)) {
        intersectionPoints.push(point);
      }
    }

    // 2. Добавляем вершины второго полигона, которые лежат внутри первого
    for (const point of poly2) {
      if (pointInPolygon(point, poly1)) {
        intersectionPoints.push(point);
      }
    }

    // 3. Находим пересечения всех ребер
    for (let i = 0; i < poly1.length; i++) {
      const p1 = poly1[i];
      const p2 = poly1[(i + 1) % poly1.length];

      for (let j = 0; j < poly2.length; j++) {
        const p3 = poly2[j];
        const p4 = poly2[(j + 1) % poly2.length];

        const intersection = lineIntersection(p1, p2, p3, p4);
        if (intersection) {
          // Проверяем, что точка не дублируется
          const isDuplicate = intersectionPoints.some(p =>
          Math.abs(p.x - intersection.x) < 1e-10 &&
          Math.abs(p.y - intersection.y) < 1e-10
          );
          if (!isDuplicate) {
            intersectionPoints.push(intersection);
          }
        }
      }
    }

    if (intersectionPoints.length < 3) return 0;

    // Находим центр тяжести для сортировки
    const center = new Point(
    intersectionPoints.reduce((sum, p) => sum + p.x, 0) / intersectionPoints.length,
    intersectionPoints.reduce((sum, p) => sum + p.y, 0) / intersectionPoints.length
    );

    // Сортируем точки
    const sortedPoints = sortPoints(intersectionPoints, center);

    // Вычисляем площадь
    return polygonArea(sortedPoints);
  }

  function drawImageRotated(ctx, img, x, y, angleDeg,strokeColor, strokeWidth, flip = 0) {
    ctx.save();

    const angleRad = angleDeg * Math.PI / 180;
    ctx.translate(x, y);
    ctx.rotate(angleRad);

    ctx.save();
    let offsetX = 0;
    let offsetY = 0;

    if (flip === 1) {        // Горизонтальное отражение
      ctx.scale(-1, 1);
      offsetX = -img.width;
    } else if (flip === 2) { // Вертикальное отражение
      ctx.scale(1, -1);
      offsetY = -img.height;
    }

    ctx.drawImage(img, offsetX, offsetY, img.width, img.height);
    ctx.restore();

    ctx.beginPath();
    ctx.rect(0, 0, img.width, img.height);
    ctx.strokeStyle = strokeColor;
    ctx.lineWidth = strokeWidth;
    ctx.stroke();

    ctx.restore();
  }

  function generatePattern(blockWidth, blockHeight, roomWidth, roomHeight, pattern = 0) {

    const resultPoints = [];

    if (pattern == 0) {

      const startPoint = [0, 0];
      const diagonalPoint1 = movePoint(startPoint, 45, blockHeight);
      const diagonalPoint2 = movePoint(startPoint, -45, blockHeight);

      const patternWidth = diagonalPoint1[1] - diagonalPoint2[1];

      const diagonalStep = blockWidth * Math.sqrt(2);

      const verticalRowsCount = Math.ceil(roomHeight / diagonalStep) + 3;

      for (let row = 0; row < verticalRowsCount; row++) {

        const yOffset = row * diagonalStep;

        const horizontalElementsCount = Math.round(roomWidth / patternWidth) + 1;

        for (let col = 0; col < horizontalElementsCount; col++) {
          const xOffset = (patternWidth / 3) + col * patternWidth;

          for (let direction = 0; direction < 2; direction++) {
            const angle = direction === 0 ? 45 : -45;

            const yCorrection = diagonalStep * 2;

            resultPoints.push([
              startPoint[0] + xOffset,
              startPoint[0] + yOffset - yCorrection,
              angle
            ]);
          }
        }
      }

    } else {

      for (let i = 0; i < Math.ceil(roomHeight / blockHeight) + 1; i++) {
        for (let j = 0; j < Math.ceil(roomWidth / blockWidth); j++) {

          resultPoints.push([
            j * blockWidth,
            (i * blockHeight) - (j % 2) * blockHeight / 2,
            0
          ]);


        }
      }

    }

    const filteredPoints = [];

    let roomPolygon = [
      [0, 0 ],
      [roomWidth, 0],
      [roomWidth, roomHeight],
      [0, roomHeight]];

    for (let i = 0; i < resultPoints.length; i++) {

      let x = resultPoints[i][0];
      let y = resultPoints[i][1];
      let angle = resultPoints[i][2];

      let p = [
        [x, y],
        [x + blockWidth, y],
        [x + blockWidth, y + blockHeight],
        [x, y + blockHeight]
      ];

      p = rotatePoints(p, angle, [x, y]);


      if (intersectionArea(roomPolygon, p) > 0) {
        filteredPoints.push(resultPoints[i]);
      }

    }

    return filteredPoints;
  }


  function generateCanvas(roomWidth, roomHeight, images, boards) {

    let w = 100;
    let h = 500;

    const canvas = document.createElement('canvas');
    canvas.width = roomWidth;
    canvas.height = roomHeight;

    const ctx = canvas.getContext('2d');

    for (let i = 0; i < boards.length; i++) {

      drawImageRotated(
      ctx,
      images[getRandomInt(0, images.length - 1)],
      boards[i][0],
      boards[i][1],
      boards[i][2],
      '#251403',
      1.25,
      getRandomInt(0, 2)
      );

    }
    return canvas;
  }
</script>


<script type="text/babel" data-presets="react">

  const RoomGenerator = () => {

    const containerRef = React.useRef(null);
    const [floorArea, setFloorArea] = React.useState(0);

    const sceneRef = React.useRef(null);
    const cameraRef = React.useRef(null);
    const rendererRef = React.useRef(null);
    const controlsRef = React.useRef(null);
    const animationIdRef = React.useRef(null);

    const patternRef = React.useRef(null);
    const widthRef = React.useRef(null);
    const lengthRef = React.useRef(null);
    const heightRef = React.useRef(null);
    const infoRef = React.useRef(null);

    const roomGroupRef = React.useRef(null);

    const createFloorTexture = async (boards, w, l) => {
      const base64Images = ['textures/1.jpg', 'textures/2.jpg', 'textures/3.jpg', 'textures/4.jpg', 'textures/5.jpg'];
      const images = await Promise.all(
      base64Images.map(base64 => {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = reject;
          img.src = base64;
        });
      })
      );




      const texture = new THREE.CanvasTexture(generateCanvas(w * 1000, l * 1000, images, boards));
      texture.wrapS = THREE.ClampToEdgeWrapping;
      texture.wrapT = THREE.ClampToEdgeWrapping;
      texture.needsUpdate = true;

      return texture;
    };

    const  generateRoom = async() => {


      if (!sceneRef.current) return;

      if (roomGroupRef.current) {
        sceneRef.current.remove(roomGroupRef.current);

        if (roomGroupRef.current.children) {
          roomGroupRef.current.children.forEach(child => {
            if (child.material) {
              if (child.material.map) child.material.map.dispose();
              child.material.dispose();
            }
            if (child.geometry) child.geometry.dispose();
          });
        }
      }


      const group = new THREE.Group();

      const w = widthRef.current.value;
      const l = lengthRef.current.value;
      const h = heightRef.current.value;


      const area = w * l;
      setFloorArea(area);


      let  boards = generatePattern(127, 635, w * 1000, l * 1000, patternRef.current.value);
      const floorTexture = await createFloorTexture(boards, w, l);

      const floorMaterial = new THREE.MeshStandardMaterial({
        map: floorTexture,
        roughness: 0.45,
        side: THREE.DoubleSide
      });

      const floorY = -h / 2;
      const floorPlane = new THREE.Mesh(
      new THREE.PlaneGeometry(w, l),
      floorMaterial
      );
      floorPlane.rotation.x = -Math.PI / 2;
      floorPlane.position.set(0, floorY, 0);
      floorPlane.receiveShadow = true;
      group.add(floorPlane);

      const textureLoader = new THREE.TextureLoader();

      if (!document['wallTexture']) {

        const texture = textureLoader.load('textures/wall.jpg');

        texture.wrapS = THREE.RepeatWrapping;
        texture.wrapT = THREE.RepeatWrapping;

        const scaleRepeat = 1;
        const repeatX = Math.max(0.1, l / (scaleRepeat));
        const repeatY = Math.max(0.1, h / (scaleRepeat));
        texture.repeat.set(repeatX, repeatY);

        document['wallTexture'] = new THREE.MeshStandardMaterial({
          map: texture,
          roughness: 0.7,
          metalness: 0.02,
          side: THREE.DoubleSide
        });

      }

      const frontWall = new THREE.Mesh(
      new THREE.PlaneGeometry(w, h),
      document['wallTexture']
      );
      frontWall.position.set(0, 0, l / 2);
      frontWall.receiveShadow = true;
      group.add(frontWall);


      const backWall = new THREE.Mesh(
      new THREE.PlaneGeometry(w, h),
      document['wallTexture']
      );
      backWall.position.set(0, 0, -l / 2);
      backWall.rotation.y = Math.PI;
      backWall.receiveShadow = true;
      group.add(backWall);


      const leftWall = new THREE.Mesh(
      new THREE.PlaneGeometry(l, h),
      document['wallTexture']
      );
      leftWall.position.set(-w / 2, 0, 0);
      leftWall.rotation.y = Math.PI / 2;
      leftWall.receiveShadow = true;
      group.add(leftWall);


      const rightWall = new THREE.Mesh(
      new THREE.PlaneGeometry(l, h),
      document['wallTexture']
      );
      rightWall.position.set(w / 2, 0, 0);
      rightWall.rotation.y = -Math.PI / 2;
      rightWall.receiveShadow = true;
      group.add(rightWall);

      const trimMaterial = new THREE.MeshStandardMaterial({ color: 0xaaaaaa});
      const trimHeight = 0.08;
      const trimDepth = 0.03;

      const trimPositions = [
        { pos: [0, floorY + trimHeight/2, l/2 - trimDepth / 2], size: [w, trimHeight, trimDepth], rot: 0 }, // перед
        { pos: [0, floorY + trimHeight/2, -l/2  + trimDepth / 2], size: [w, trimHeight, trimDepth], rot: 0 }, // зад
        { pos: [w/2  - trimDepth / 2, floorY + trimHeight/2, 0], size: [trimDepth, trimHeight, l], rot: 0 }, // право
        { pos: [-w/2  + trimDepth / 2, floorY + trimHeight/2, 0], size: [trimDepth, trimHeight, l], rot: 0 }  // лево
      ];
      trimPositions.forEach(t => {
        const trimBox = new THREE.Mesh(new THREE.BoxGeometry(t.size[0], t.size[1], t.size[2]), trimMaterial);
        trimBox.position.set(t.pos[0], t.pos[1], t.pos[2]);
        group.add(trimBox);
      });

      roomGroupRef.current = group;
      sceneRef.current.add(group);

      infoRef.current.innerHTML = `
            Количество плашек: <b>${boards.length}</b><br>
Площадь стен: <b>${w * l * h} м<sup>2</sup></b><br>

             `;

    };

    const handleGenerate = () => {
      generateRoom();
    };

    React.useEffect(() => {

      if (!containerRef.current) return;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0a1030);

      sceneRef.current = scene;

      const camera = new THREE.PerspectiveCamera(
      45,
      containerRef.current.clientWidth / containerRef.current.clientHeight,
      0.1,
      1000
      );
      camera.position.set(5, 3.5, 6);
      camera.lookAt(0, 0, 0);
      cameraRef.current = camera;

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(containerRef.current.clientWidth, containerRef.current.clientHeight);

      containerRef.current.appendChild(renderer.domElement);
      rendererRef.current = renderer;

      const controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.06;
      controls.autoRotate = false;
      controls.enableZoom = true;
      controls.zoomSpeed = 1.2;
      controls.target.set(0, 0.5, 0);
      controlsRef.current = controls;


      const chandelierLight = new THREE.PointLight(0xffdd99, 1.5, 12);
      chandelierLight.position.set(0, 2.5, 0);
      chandelierLight.castShadow = false;
      scene.add(chandelierLight);

      generateRoom();

      const animate = () => {
        animationIdRef.current = requestAnimationFrame(animate);
        if (controlsRef.current) controlsRef.current.update();
        if (rendererRef.current && sceneRef.current && cameraRef.current) {
          rendererRef.current.render(sceneRef.current, cameraRef.current);
        }
      };
      animate();

      const handleResize = () => {
        if (!containerRef.current || !rendererRef.current || !cameraRef.current) return;
        const w = containerRef.current.clientWidth;
        const h = containerRef.current.clientHeight;
        rendererRef.current.setSize(w, h);
        cameraRef.current.aspect = w / h;
        cameraRef.current.updateProjectionMatrix();
      };
      window.addEventListener('resize', handleResize);

      return () => {
        if (animationIdRef.current) cancelAnimationFrame(animationIdRef.current);
        window.removeEventListener('resize', handleResize);
        if (controlsRef.current) controlsRef.current.dispose();
        if (rendererRef.current && containerRef.current && rendererRef.current.domElement) {
          if (containerRef.current.contains(rendererRef.current.domElement)) {
            containerRef.current.removeChild(rendererRef.current.domElement);
          }
        }
        if (roomGroupRef.current && sceneRef.current) {
          sceneRef.current.remove(roomGroupRef.current);
        }
      };
    }, []);


    return (
    <div style={{ width: '100%', height: '100%', position: 'relative' }}>
      <div
      ref={containerRef}
      style={{
        position: 'fixed',
        top: 0,
        left: 0,
        width: '100vw',
        height: '100vh',
        overflow: 'hidden',
        zIndex: 1
      }}
      />

      <div className="card">
        <div className="mb-2">
          <label>Ширина комнаты</label>
          <input ref={widthRef} defaultValue={5.5} className="form-control" type="number" step="0.2" min="1.5" max="8.0" />
        </div>

        <div className="mb-2">
          <label>Длина комнаты</label>
          <input ref={lengthRef} defaultValue={5.5}  className="form-control" type="number" step="0.2" min="1.5" max="8.0" />
        </div>

        <div className="mb-2">
          <label>Высота стен</label>
          <input ref={heightRef} defaultValue={2.5} className="form-control" type="number" step="0.2" min="1.2" max="4.5" />
        </div>

        <div className="mb-2">
          <label>Тип укладки</label>
          <select className="form-select" defaultValue={0} ref={patternRef}>
            <option value="0">Елочка</option>
            <option value="1">Прямоугольный</option>
          </select>
        </div>

        <button className="generate-btn btn btn-primary mb-4 mt-2" onClick={handleGenerate}>
          Обновить
        </button>

        <div className="area-display alert alert-primary" ref={infoRef}>
          <span>Площадь пола:</span>
          <span className="area-value">{floorArea.toFixed(2)}</span>
          <span>кв. ед.</span>
        </div>
      </div>
    </div>
    );
  };

  const App = () => <RoomGenerator />;
  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<App />);
</script>
</body>
</html>
